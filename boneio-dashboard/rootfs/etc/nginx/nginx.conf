# Load dynamic modules (brotli, etc.) installed via apt
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression — universal fallback.
    # Backend responses arrive uncompressed (Accept-Encoding: "" for sub_filter),
    # so nginx must re-compress before sending to browser.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    # Brotli compression — ~20% smaller than gzip for JS/CSS.
    # Modern browsers prefer brotli when available.
    # Monaco editor chunk: ~4MB raw → ~1MB gzip → ~720KB brotli.
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/servers/*.conf;
}
