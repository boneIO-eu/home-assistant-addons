proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_redirect              off;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    16m;
proxy_buffers               16 256k;
proxy_buffer_size           256k;
proxy_busy_buffers_size     512k;

# Disable Accept-Encoding to get uncompressed responses from backend.
# Required for sub_filter to work (it cannot process gzip'd content).
# nginx gzip module re-compresses the response before sending to browser.
proxy_set_header Accept-Encoding "";
proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-NginX-Proxy true;

proxy_ssl_verify off;
proxy_ssl_server_name on;
proxy_ssl_session_reuse off;
