<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boneIO Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 220px;
            --sidebar-bg: #1c1c1c;
            --sidebar-hover: #2a2a2a;
            --sidebar-active: #3a3a3a;
            --sidebar-text: #e0e0e0;
            --sidebar-text-muted: #888;
            --accent: #4fc3f7;
            --border: #333;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #111;
            color: var(--sidebar-text);
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header svg {
            width: 28px;
            height: 28px;
            fill: var(--accent);
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--sidebar-text);
        }

        .sidebar-header span {
            font-size: 11px;
            color: var(--sidebar-text-muted);
            display: block;
        }

        .device-list {
            flex: 1;
            padding: 8px 0;
        }

        .device-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            user-select: none;
        }

        .device-item:hover {
            background: var(--sidebar-hover);
        }

        .device-item.active {
            background: var(--sidebar-active);
            border-left-color: var(--accent);
        }

        .device-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .device-item.active .dot {
            background: var(--accent);
        }

        .device-item .name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--sidebar-text-muted);
            text-align: center;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #111;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--sidebar-text-muted);
            gap: 12px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: #333;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Loading state */
        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading::after {
            content: '';
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile: sidebar collapses */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 56px;
            }

            .sidebar-header h1,
            .sidebar-header span,
            .device-item .name,
            .sidebar-footer {
                display: none;
            }

            .sidebar-header {
                justify-content: center;
                padding: 12px 8px;
            }

            .device-item {
                justify-content: center;
                padding: 12px 8px;
            }

            .device-item .dot {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <div>
                    <h1>boneIO</h1>
                    <span>Dashboard</span>
                </div>
            </div>
            <div class="device-list" id="deviceList">
                <!-- Devices populated by JS -->
            </div>
            <div class="sidebar-footer">
                boneIO Dashboard v1.0
            </div>
        </nav>
        <main class="main" id="mainContent">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
                </svg>
                <p>Select a device from the sidebar</p>
            </div>
        </main>
    </div>

    <script>
        const INGRESS_ENTRY = '__INGRESS_ENTRY__';
        let devices = [];
        let activeIndex = -1;

        /**
         * Load device list from generated JSON.
         */
        async function loadDevices() {
            try {
                const resp = await fetch(INGRESS_ENTRY + '/api/devices');
                devices = await resp.json();
                renderDeviceList();

                // Auto-select first device if available
                if (devices.length > 0) {
                    selectDevice(0);
                }
            } catch (err) {
                console.error('Failed to load devices:', err);
            }
        }

        /**
         * Render the device list in the sidebar.
         */
        function renderDeviceList() {
            const list = document.getElementById('deviceList');
            list.innerHTML = '';

            devices.forEach((device, index) => {
                const item = document.createElement('div');
                item.className = 'device-item';
                item.setAttribute('title', device.name);
                item.innerHTML = `
                    <span class="dot"></span>
                    <span class="name">${escapeHtml(device.name)}</span>
                `;
                item.addEventListener('click', () => selectDevice(index));
                list.appendChild(item);
            });
        }

        /**
         * Select a device and load its frontend in the iframe.
         */
        function selectDevice(index) {
            if (index === activeIndex) return;
            activeIndex = index;

            // Update sidebar active state
            document.querySelectorAll('.device-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const main = document.getElementById('mainContent');
            const device = devices[index];

            // Remove empty state if present
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            // Remove existing iframe
            const existingIframe = main.querySelector('iframe');
            if (existingIframe) existingIframe.remove();

            // Show loading
            let loading = main.querySelector('.loading');
            if (!loading) {
                loading = document.createElement('div');
                loading.className = 'loading';
                main.appendChild(loading);
            }

            // Create iframe
            const iframe = document.createElement('iframe');
            iframe.src = device.path;
            iframe.addEventListener('load', () => {
                const loadingEl = main.querySelector('.loading');
                if (loadingEl) loadingEl.remove();
            });
            main.appendChild(iframe);
        }

        /**
         * Escape HTML to prevent XSS.
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        loadDevices();
    </script>
</body>
</html>
