<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boneIO Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 220px;
            --sidebar-collapsed: 48px;
        }

        /* Dark theme (default) */
        [data-theme="dark"] {
            --sidebar-bg: #1c1c1c;
            --sidebar-hover: #2a2a2a;
            --sidebar-active: #3a3a3a;
            --sidebar-text: #e0e0e0;
            --sidebar-text-muted: #888;
            --accent: #4fc3f7;
            --border: #333;
            --bg: #111;
        }

        /* Light theme */
        [data-theme="light"] {
            --sidebar-bg: #f5f5f5;
            --sidebar-hover: #e8e8e8;
            --sidebar-active: #ddd;
            --sidebar-text: #1a1a1a;
            --sidebar-text-muted: #666;
            --accent: #0288d1;
            --border: #ddd;
            --bg: #fff;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--sidebar-text);
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: width 0.2s ease, min-width 0.2s ease;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
            min-width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
        }

        .sidebar-header svg {
            width: 28px;
            height: 28px;
            fill: var(--accent);
            flex-shrink: 0;
        }

        .sidebar-header .header-text {
            overflow: hidden;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.15s ease;
        }

        .sidebar.collapsed .header-text {
            opacity: 0;
            width: 0;
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--sidebar-text);
        }

        .sidebar-header span {
            font-size: 11px;
            color: var(--sidebar-text-muted);
            display: block;
        }

        .device-list {
            flex: 1;
            padding: 8px 0;
        }

        .device-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            user-select: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar.collapsed .device-item {
            justify-content: center;
            padding: 12px 0;
        }

        .sidebar.collapsed .device-item .name {
            display: none;
        }

        .sidebar.collapsed .device-item .dot {
            width: 10px;
            height: 10px;
        }

        .device-item:hover {
            background: var(--sidebar-hover);
        }

        .device-item.active {
            background: var(--sidebar-active);
            border-left-color: var(--accent);
        }

        .device-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .device-item.active .dot {
            background: var(--accent);
        }

        .device-item .name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .device-item .external-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            color: var(--sidebar-text-muted);
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
            text-decoration: none;
        }

        .device-item .external-link:hover {
            color: var(--accent);
            background: rgba(255,255,255,0.08);
        }

        [data-theme="light"] .device-item .external-link:hover {
            background: rgba(0,0,0,0.06);
        }

        .device-item .external-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .sidebar.collapsed .device-item .external-link {
            display: none;
        }

        /* Toggle button */
        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
            color: var(--sidebar-text-muted);
            transition: color 0.15s, background 0.15s;
            border-top: 1px solid var(--border);
            user-select: none;
            font-size: 18px;
            min-height: 40px;
        }

        .sidebar-toggle:hover {
            color: var(--sidebar-text);
            background: var(--sidebar-hover);
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.2s ease;
        }

        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--sidebar-text-muted);
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity 0.15s ease;
        }

        .sidebar.collapsed .sidebar-footer {
            opacity: 0;
            padding: 0;
            height: 0;
            border: none;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg);
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--sidebar-text-muted);
            gap: 12px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: #333;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Loading state */
        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading::after {
            content: '';
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile hamburger button */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--sidebar-bg);
            color: var(--accent);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .mobile-menu-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Backdrop overlay */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 299;
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: flex;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 300;
                width: var(--sidebar-width);
                min-width: var(--sidebar-width);
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 4px 0 16px rgba(0,0,0,0.5);
            }

            .sidebar.collapsed {
                width: var(--sidebar-width);
                min-width: var(--sidebar-width);
            }

            .sidebar.collapsed .header-text,
            .sidebar.collapsed .device-item .name {
                opacity: 1;
                width: auto;
                display: initial;
            }

            .sidebar.collapsed .device-item {
                justify-content: initial;
                padding: 10px 16px;
            }

            .sidebar.collapsed .device-item .dot {
                width: 8px;
                height: 8px;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .sidebar-backdrop.visible {
                display: block;
            }

            .sidebar-toggle {
                display: none;
            }

            .main {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <div class="header-text">
                    <h1>boneIO</h1>
                    <span>Dashboard</span>
                </div>
            </div>
            <div class="device-list" id="deviceList">
                <!-- Devices populated by JS -->
            </div>
            <div class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </div>
        </nav>
        <main class="main" id="mainContent">
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
                </svg>
                <p>Select a device from the sidebar</p>
            </div>
        </main>
    </div>

    <script>
        const INGRESS_ENTRY = '__INGRESS_ENTRY__';
        let devices = [];
        let activeIndex = -1;

        /**
         * Load device list from generated JSON.
         */
        async function loadDevices() {
            try {
                const resp = await fetch(INGRESS_ENTRY + '/api/devices');
                devices = await resp.json();
                renderDeviceList();

                // Auto-select first device if available
                if (devices.length > 0) {
                    selectDevice(0);
                }
            } catch (err) {
                console.error('Failed to load devices:', err);
            }
        }

        /**
         * Render the device list in the sidebar.
         */
        function renderDeviceList() {
            const list = document.getElementById('deviceList');
            list.innerHTML = '';

            devices.forEach((device, index) => {
                const item = document.createElement('div');
                item.className = 'device-item';
                item.setAttribute('title', device.name);
                item.innerHTML = `
                    <span class="dot"></span>
                    <span class="name">${escapeHtml(device.name)}</span>
                    <a class="external-link" href="${escapeHtml(device.url)}" target="_blank" rel="noopener noreferrer" title="Open ${escapeHtml(device.name)} directly">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zm-2 16H5V7h7V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7h-2v7H5z"/></svg>
                    </a>
                `;
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.external-link')) return;
                    selectDevice(index);
                });
                list.appendChild(item);
            });
        }

        /**
         * Select a device and load its frontend in the iframe.
         */
        function selectDevice(index) {
            if (index === activeIndex) return;
            activeIndex = index;

            // Close mobile drawer if open
            closeMobileDrawer();

            // Update sidebar active state
            document.querySelectorAll('.device-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            const main = document.getElementById('mainContent');
            const device = devices[index];

            // Remove empty state if present
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            // Remove existing iframe
            const existingIframe = main.querySelector('iframe');
            if (existingIframe) existingIframe.remove();

            // Show loading
            let loading = main.querySelector('.loading');
            if (!loading) {
                loading = document.createElement('div');
                loading.className = 'loading';
                main.appendChild(loading);
            }

            // Create iframe
            const iframe = document.createElement('iframe');
            const sep = device.path.includes('?') ? '&' : '?';
            iframe.src = device.path + sep + 'theme=' + currentTheme;
            iframe.addEventListener('load', () => {
                const loadingEl = main.querySelector('.loading');
                if (loadingEl) loadingEl.remove();
            });
            main.appendChild(iframe);
        }

        /**
         * Escape HTML to prevent XSS.
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Toggle sidebar collapsed state (desktop) and mobile drawer.
         */
        function initSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.getElementById('sidebarToggle');
            const mobileBtn = document.getElementById('mobileMenuBtn');
            const backdrop = document.getElementById('sidebarBackdrop');
            const stored = localStorage.getItem('boneio-sidebar-collapsed');

            if (stored === 'true') {
                sidebar.classList.add('collapsed');
            }

            // Desktop toggle
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem(
                    'boneio-sidebar-collapsed',
                    sidebar.classList.contains('collapsed')
                );
            });

            // Mobile drawer open
            mobileBtn.addEventListener('click', () => {
                sidebar.classList.add('mobile-open');
                backdrop.classList.add('visible');
            });

            // Mobile drawer close
            backdrop.addEventListener('click', closeMobileDrawer);
        }

        function closeMobileDrawer() {
            const sidebar = document.querySelector('.sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebar.classList.remove('mobile-open');
            backdrop.classList.remove('visible');
        }

        /**
         * Detect theme from HA (prefers-color-scheme) and apply.
         */
        let currentTheme = 'dark';

        function initTheme() {
            const mq = window.matchMedia('(prefers-color-scheme: light)');
            currentTheme = mq.matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);

            mq.addEventListener('change', (e) => {
                currentTheme = e.matches ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', currentTheme);
            });
        }

        // Initialize
        initTheme();
        initSidebar();
        loadDevices();
    </script>
</body>
</html>
