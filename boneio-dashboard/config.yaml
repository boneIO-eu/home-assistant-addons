name: boneIO Black Dashboard
version: 1.0.6
slug: boneio--black-dashboard
description: Multi-device dashboard for boneIO Black controllers. Access all your boneIO devices from a single panel in Home Assistant.
url: "https://github.com/boneio-eu/home-assistant-addons"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 5100
ingress_entry: /
panel_icon: "mdi:alpha-b-circle-outline"
panel_title: boneIO Black
panel_admin: false
host_network: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  devices:
    - name: "boneIO Black 1"
      url: "https://192.168.1.100:8443"
schema:
  devices:
    - name: str
      url: "match(^https?://.+)"
map: []
